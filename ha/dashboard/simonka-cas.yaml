# Dashboard "Simonka" (url: /simonka-cas), nasadeny v HA ako samostatny
# dashboard - zamerne NIE ako view v hlavnom Prehlade, ktoreho config ma
# 205 kB a nema zmysel ho kvoli tomuto prepisovat.
#
# Obnova: Nastavenia > Dashboardy > Simonka > ceruzka > tri bodky >
# "Surovy editor konfiguracie" a vlozit tento obsah.
#
# Tlacidla volaju skripty z packages/simona_cas.yaml, lebo karta typu button
# nevie odovzdat parameter priamo do input_number.set_value.

views:
  - title: Čas
    path: cas
    icon: mdi:timer-outline
    type: sections
    max_columns: 2
    sections:
      # -- Prehlad ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Spoločný čas
            heading_style: title
            icon: mdi:scale-balance

          - type: markdown
            content: >-
              {% set z = states('sensor.simona_cas_zostava') | int(0) %}

              {% set c = states('sensor.simona_rozpocet_celkom') | int(0) %}

              {% set t = states('sensor.simona_tablet_pouzite') | int(0) %}

              {% set p = states('sensor.simona_pc_zapocitane') | int(0) %}

              {% set nt = states('input_number.simona_offset_tablet') | int(0) %}

              {% set np = states('input_number.simona_offset_pc') | int(0) %}

              {% if is_state('input_boolean.simona_bez_limitu','on') %}### ♾ Režim bez limitu

              Čas sa teraz neráta — zastavený na {{ t + p }} min.

              {% elif is_state('input_boolean.simona_zdielany_cas','off') %}### ⏸
              Zdieľanie je pozastavené

              HA teraz do ničoho nezasahuje.

              {% elif z == 0 %}### ⛔ Čas na dnes je vyčerpaný

              {% else %}### ⏱ Zostáva {{ z }} min

              {% endif %}


              **Rozpočet dnes:** {{ c }} min &nbsp;·&nbsp; **použité:** {{ t + p }} min


              | | minút |

              |---|---:|

              | 📱 Tablet | {{ t }} |

              | 🖥 Počítač | {{ p }} |

              {% if nt + np > 0 %}| ♾ Nezapočítané | {{ nt + np }} |

              {% endif %}


              <small>Strop tabletu {{ states('sensor.simona_tablet_cielovy_limit')
              | int(0) }} min · na PC smie spolu {{
              states('sensor.simona_pc_povolene') | int(0) }} min</small>

          - type: gauge
            entity: sensor.simona_cas_zostava
            name: Zostáva
            unit: min
            min: 0
            max: 240
            needle: false
            severity:
              green: 31
              yellow: 11
              red: 0

      # -- Akcie --------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Režim
            heading_style: title
            icon: mdi:infinity

          - type: entities
            entities:
              - entity: input_boolean.simona_bez_limitu
                name: Bez limitu (čas sa neráta)
                secondary_info: last-changed
              - entity: input_boolean.simona_zdielany_cas
                name: Zdieľanie času aktívne

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.simona_bez_limitu
                state: "on"
            card:
              type: markdown
              content: >-
                <small>Kým je zapnutý, tablet ani počítač neujedajú z rozpočtu
                a nechodia žiadne upozornenia. Po vypnutí sa počíta ďalej od
                hodnoty, na ktorej sa zastavilo.</small>

          - type: heading
            heading: Pridať čas
            heading_style: title
            icon: mdi:clock-plus-outline

          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: +15 min
                icon: mdi:clock-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 15 }
              - type: button
                name: +30 min
                icon: mdi:clock-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 30 }
              - type: button
                name: +60 min
                icon: mdi:clock-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 60 }

          - type: heading
            heading: Nastaviť rozpočet na dnes
            heading_style: subtitle

          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: "60"
                icon: mdi:wallet-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_nastav
                  data: { minuty: 60 }
              - type: button
                name: "120"
                icon: mdi:wallet-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_nastav
                  data: { minuty: 120 }
              - type: button
                name: "180"
                icon: mdi:wallet-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_nastav
                  data: { minuty: 180 }

          - type: entities
            entities:
              - entity: input_number.simona_rozpocet_dnes
                name: Rozpočet dnes (ručne)

          - type: button
            name: Ukončiť čas teraz
            icon: mdi:timer-off-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.simona_cas_ukonci
            confirmation:
              text: Naozaj ukončiť čas? Tablet sa hneď zamkne.

      # -- Tyzdenny rozvrh ----------------------------------------------------
      # Kopia rozvrhu z Family Link - ten sa cez integraciu vycitat NEDA
      # (coordinator vidi len hodnotu platnu na dnes, vratane nasho override).
      # O 00:05 sa z tohto rozvrhu naplni rozpocet na novy den.
      - type: grid
        cards:
          - type: heading
            heading: Týždenný rozvrh
            heading_style: title
            icon: mdi:calendar-clock

          - type: markdown
            content: >-
              Dnes je **{{ state_attr('sensor.simona_rozvrh_dnes','den') }}** —
              rozvrh dáva **{{ states('sensor.simona_rozvrh_dnes') | int(0) }} min**,
              zajtra {{ state_attr('sensor.simona_rozvrh_dnes','zajtra') | int(0) }} min.


              <small>Nový rozpočet sa z rozvrhu naplní o 00:05. Keď zmeníš
              limit v aplikácii Family Link, HA to prevezme sem samo (a napíše
              ti o tom). Opačne to neplatí — zmena tu **neprepíše rozvrh v
              aplikácii**.</small>

          - type: entities
            entities:
              - entity: input_number.simona_rozvrh_po
                name: Pondelok
              - entity: input_number.simona_rozvrh_ut
                name: Utorok
              - entity: input_number.simona_rozvrh_st
                name: Streda
              - entity: input_number.simona_rozvrh_stv
                name: Štvrtok
              - entity: input_number.simona_rozvrh_pi
                name: Piatok
              - entity: input_number.simona_rozvrh_so
                name: Sobota
              - entity: input_number.simona_rozvrh_ne
                name: Nedeľa
              # Diagnostika: co sme naposledy poslali do Family Link. Podla
              # tohto zoznamu automatizacia rozozna vlastnu ozvenu od zmeny,
              # ktoru urobil rodic v aplikacii.
              - entity: input_text.simona_fl_zapisane
                name: Naposledy zapísané do FL

      # -- Tablet -------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Tablet (Family Link)
            heading_style: title
            icon: mdi:tablet

          - type: entities
            entities:
              - entity: sensor.simona_tablet_pouzite
                name: Započítané dnes
              - entity: sensor.iplay_50_screen_time_remaining
                name: Zostáva podľa Family Link
              - entity: sensor.iplay_50_daily_limit
                name: Denný limit
              - entity: sensor.iplay_50_active_bonus
                name: Bonus
              - entity: input_number.simona_offset_tablet
                name: Nezapočítané (bez limitu)
              - entity: binary_sensor.iplay_50_bedtime_active
                name: Nočný režim
              - entity: binary_sensor.iplay_50_school_time_active
                name: Školský čas

          # POZOR na semantiku switch.iplay_50 v integracii familylink:
          #   async_turn_on()  = ODOMKNUT zariadenie
          #   async_turn_off() = ZAMKNUT zariadenie
          # Preto tu nie je prepinac, ale dve jednoznacne tlacidla - prepinac
          # nazvany "Zamknut tablet" zvadzal k tomu, ze jeho vypnutim
          # (v domnieni "vypinam zamok") sa tablet prave zamkol.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Zamknúť tablet
                icon: mdi:cellphone-lock
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_off
                  target:
                    entity_id: switch.iplay_50
                confirmation:
                  text: Zamknúť tablet? Kým bude zamknutý, Family Link neprijme zmeny limitu.
              - type: button
                name: Odomknúť tablet
                icon: mdi:cellphone-check
                tap_action:
                  action: perform-action
                  perform_action: switch.turn_on
                  target:
                    entity_id: switch.iplay_50

          - type: markdown
            content: >-
              {% set a = state_attr('sensor.simona_fabriciova_daily_screen_time','apps') %}

              **Dnes najviac času:**


              {% if a %}{% for x in a[:5] %}- {{ x.name }} — {{ x.time }}

              {% endfor %}{% else %}_zatiaľ nič_{% endif %}

      # -- Pocitac ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Počítač
            heading_style: title
            icon: mdi:desktop-classic

          - type: entities
            entities:
              - entity: binary_sensor.simona_pc_online
                name: Agent sa hlási
              - entity: input_boolean.simona_pc_pouziva_sa
                name: Práve pri ňom sedí
              - entity: sensor.simona_pc_zapocitane
                name: Započítané dnes
              - entity: input_number.simona_pc_pouzite
                name: Namerané agentom
              - entity: input_number.simona_offset_pc
                name: Nezapočítané (bez limitu)
              - entity: sensor.simona_pc_povolene
                name: Smie spolu
              - entity: input_datetime.simona_pc_kontakt
                name: Posledný kontakt

          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Zamknúť
                icon: mdi:lock
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: lock }
              - type: button
                name: Uspať
                icon: mdi:power-sleep
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: sleep }
              - type: button
                name: Reštart
                icon: mdi:restart
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: restart }
                confirmation:
                  text: Reštartovať počítač?
              - type: button
                name: Vypnúť
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: shutdown }
                confirmation:
                  text: Vypnúť počítač?

          - type: markdown
            content: >-
              <small>Počítač sa po vyčerpaní času **neblokuje** — agent len
              upozorní hlasom a textom. Keď si pri ňom po nule sadne, príde
              správa na TV a do Telegramu.</small>
