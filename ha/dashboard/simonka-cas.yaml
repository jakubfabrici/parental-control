# Dashboard "Simonka" (url: /simonka-cas), nasadeny v HA ako samostatny
# dashboard - zamerne NIE ako view v hlavnom Prehlade, ktoreho config ma
# 205 kB a nema zmysel ho kvoli tomuto prepisovat.
#
# Obnova: Nastavenia > Dashboardy > Simonka > ceruzka > tri bodky >
# "Surovy editor konfiguracie" a vlozit tento obsah.
#
# Tlacidla volaju skripty z packages/simona_cas.yaml, lebo karta typu button
# nevie odovzdat parameter priamo do input_number.set_value. Sekcia Tablet
# bezi nad TimeLimit (add-on + most).

views:
  - title: Čas
    path: cas
    icon: mdi:timer-outline
    type: sections
    max_columns: 2
    sections:
      # -- Uplny zamok --------------------------------------------------------
      # Balik packages/simona_zamok.yaml: tablet celý zamknutý cez TimeLimit,
      # PC sa hneď vypne a pri každom zapnutí znova.
      - type: grid
        cards:
          - type: heading
            heading: Úplný zámok
            heading_style: title
            icon: mdi:lock

          - type: tile
            entity: input_boolean.simona_uplny_zamok
            name: Úplný zámok (tablet + PC)
            icon: mdi:lock
            # aj ikona dlazdice prepina (predvolene bez potvrdenia) - rovnake
            # potvrdenie, podrzanie a dvojklik nerobia nic
            tap_action:
              action: toggle
              confirmation:
                text: >-
                  Prepnúť úplný zámok? Pri zapnutí sa tablet celý zamkne a
                  počítač sa hneď vypne (a pri každom zapnutí znova).
            icon_tap_action:
              action: toggle
              confirmation:
                text: >-
                  Prepnúť úplný zámok? Pri zapnutí sa tablet celý zamkne a
                  počítač sa hneď vypne (a pri každom zapnutí znova).
            hold_action:
              action: none
            double_tap_action:
              action: none

          - type: markdown
            content: >-
              {% set z = 'binary_sensor.timelimit_simonka_uplny_zamok' %}
              {% if is_state('input_boolean.simona_uplny_zamok','on') %}### 🔐 Zámok je zapnutý

              📱 Tablet: {% if state_attr(z,'delivered') == true %}zamknutý ✅{%
              elif state_attr(z,'applied') == true %}nie je pripojený – zamkne sa, keď sa pripojí ⏳{%
              else %}čaká na most ⏳{% endif %} &nbsp;·&nbsp; 🖥 Počítač: {{ 'zapnutý – vypína sa ⏳'
              if is_state('binary_sensor.simona_zamok_pc_zapnute','on') else 'vypnutý ✅' }}

              <small>Tablet bez pripojenia (zhasnutá obrazovka, lietadlový režim) sa
              zamkne hneď, ako sa pripojí. Zrušiť aj cez Telegram /odomkni.</small>
              {% elif is_state(z,'on') %}### 🔓 Zámok sa ruší

              Server TimeLimit zatiaľ neodpovedá, most to skúša ďalej – tablet sa
              odomkne sám.
              {% else %}Zámok je vypnutý — tablet aj počítač idú podľa spoločného
              času.{% endif %}

      # -- Prehlad ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Spoločný čas
            heading_style: title
            icon: mdi:scale-balance

          - type: markdown
            content: >-
              {% set z = states('sensor.simona_cas_zostava') | int(0) %}

              {% set c = states('sensor.simona_rozpocet_celkom') | int(0) %}

              {% set t = states('sensor.simona_tablet_pouzite') | int(0) %}

              {% set p = states('sensor.simona_pc_zapocitane') | int(0) %}

              {% set nt = states('input_number.simona_offset_tablet') | int(0) %}

              {% set np = states('input_number.simona_offset_pc') | int(0) %}

              {% if is_state('input_boolean.simona_bez_limitu','on') %}### ♾ Režim bez limitu

              Čas sa teraz neráta — zastavený na {{ t + p }} min.

              {% elif is_state('input_boolean.simona_zdielany_cas','off') %}### ⏸
              Zdieľanie je pozastavené

              HA teraz do ničoho nezasahuje.

              {% elif z == 0 %}### ⛔ Čas na dnes je vyčerpaný

              {% else %}### ⏱ Zostáva {{ z }} min

              {% endif %}


              **Rozpočet dnes:** {{ c }} min &nbsp;·&nbsp; **použité:** {{ t + p }} min


              | | minút |

              |---|---:|

              | 📱 Tablet | {{ t }} |

              | 🖥 Počítač | {{ p }} |

              {% if nt + np > 0 %}| ♾ Nezapočítané | {{ nt + np }} |

              {% endif %}


              <small>Strop tabletu {{ states('sensor.simona_tablet_cielovy_limit')
              | int(0) }} min · na PC smie spolu {{
              states('sensor.simona_pc_povolene') | int(0) }} min</small>

          - type: gauge
            entity: sensor.simona_cas_zostava
            name: Zostáva
            unit: min
            min: 0
            max: 240
            needle: false
            severity:
              green: 31
              yellow: 11
              red: 0

      # -- Akcie --------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Režim
            heading_style: title
            icon: mdi:infinity

          - type: entities
            entities:
              - entity: input_boolean.simona_bez_limitu
                name: Bez limitu (čas sa neráta)
                secondary_info: last-changed
              - entity: input_boolean.simona_zdielany_cas
                name: Zdieľanie času aktívne

          - type: conditional
            conditions:
              - condition: state
                entity: input_boolean.simona_bez_limitu
                state: "on"
            card:
              type: markdown
              content: >-
                <small>Kým je zapnutý, tablet ani počítač neujedajú z rozpočtu
                a nechodia žiadne upozornenia. Po vypnutí sa počíta ďalej od
                hodnoty, na ktorej sa zastavilo.</small>

          - type: heading
            heading: Pridať čas
            heading_style: title
            icon: mdi:clock-plus-outline

          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: +15 min
                icon: mdi:clock-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 15 }
              - type: button
                name: +30 min
                icon: mdi:clock-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 30 }
              - type: button
                name: +60 min
                icon: mdi:clock-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 60 }

          - type: heading
            heading: Nastaviť rozpočet na dnes
            heading_style: subtitle

          - type: grid
            columns: 3
            square: false
            cards:
              - type: button
                name: "60"
                icon: mdi:wallet-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_nastav
                  data: { minuty: 60 }
              - type: button
                name: "120"
                icon: mdi:wallet-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_nastav
                  data: { minuty: 120 }
              - type: button
                name: "180"
                icon: mdi:wallet-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_nastav
                  data: { minuty: 180 }

          - type: entities
            entities:
              - entity: input_number.simona_rozpocet_dnes
                name: Rozpočet dnes (ručne)

          - type: button
            name: Ukončiť čas teraz
            icon: mdi:timer-off-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.simona_cas_ukonci
            confirmation:
              text: Naozaj ukončiť čas? Tablet sa hneď zamkne.

      # -- Tyzdenny rozvrh ----------------------------------------------------
      # Rozvrh v HA je jediny zdroj pravdy. O 00:06 sa z neho naplni
      # rozpocet na novy den (balik simona_cas.yaml, polnocny reset).
      - type: grid
        cards:
          - type: heading
            heading: Týždenný rozvrh
            heading_style: title
            icon: mdi:calendar-clock

          - type: markdown
            content: >-
              Dnes je **{{ state_attr('sensor.simona_rozvrh_dnes','den') }}** —
              rozvrh dáva **{{ states('sensor.simona_rozvrh_dnes') | int(0) }} min**,
              zajtra {{ state_attr('sensor.simona_rozvrh_dnes','zajtra') | int(0) }} min.


              <small>Nový rozpočet sa z rozvrhu naplní o 00:06. Tablet ide
              cez TimeLimit: HA mu každú chvíľu nastaví, koľko smie dnes
              celkovo (rozpočet mínus PC). Pravidlá v appke (1 h / 3 h) sú len
              poistka, keby HA nebežal — keď ich zmeníš, uprav aj rozvrh tu.</small>

          - type: entities
            entities:
              - entity: input_number.simona_rozvrh_po
                name: Pondelok
              - entity: input_number.simona_rozvrh_ut
                name: Utorok
              - entity: input_number.simona_rozvrh_st
                name: Streda
              - entity: input_number.simona_rozvrh_stv
                name: Štvrtok
              - entity: input_number.simona_rozvrh_pi
                name: Piatok
              - entity: input_number.simona_rozvrh_so
                name: Sobota
              - entity: input_number.simona_rozvrh_ne
                name: Nedeľa

      # -- Tablet (TimeLimit) ---------------------------------------------------
      # Entity dava most v add-one TimeLimit (ha/addons/timelimit/bridge/)
      # cez MQTT discovery.
      # Zoznam nainstalovanych aplikacii tablet posiela sifrovane, most vidi
      # len baliky priradene do kategorii - preto vyber + textove pole.
      - type: grid
        cards:
          - type: heading
            heading: Tablet (TimeLimit)
            heading_style: title
            icon: mdi:tablet

          - type: markdown
            content: >-
              {% set u = states('sensor.timelimit_zariadenie_iplay_50') %}

              {% set m = states('sensor.timelimit_most') %}

              {% if is_state('switch.timelimit_simonka_zablokovane','on') %}### 🔒 Tablet je zablokovaný

              {% elif is_state('switch.timelimit_simonka_bez_limitu','on') %}### ♾ Bez limitu do konca dňa

              {% elif states('sensor.timelimit_simonka_zostava_dnes') in ['unknown','unavailable','None'] %}### ⏱ Bez denného limitu

              {% else %}### ⏱ Zostáva {{ states('sensor.timelimit_simonka_zostava_dnes') | int(0) }} min

              {% endif %}


              Na tablete je prihlásený **{{ u }}**{% if u != 'Simonka' %} —
              kým to nie je Simonka, appka nič nevynucuje{% endif %}.
              Most: {{ m }}{% if state_attr('sensor.timelimit_most','last_sync') %},
              sync {{ as_timestamp(state_attr('sensor.timelimit_most','last_sync')) | timestamp_custom('%H:%M:%S') }}{% endif %}.

          - type: entities
            entities:
              - entity: sensor.timelimit_simonka_pouzite_dnes
                name: Použité dnes
              - entity: sensor.timelimit_simonka_zostava_dnes
                name: Zostáva dnes
              - entity: sensor.timelimit_simonka_limit_dnes
                name: Limit dnes (pravidlá appky + strop HA)
              - entity: switch.timelimit_simonka_zablokovane
                name: Zablokovať tablet
                secondary_info: last-changed
              - entity: switch.timelimit_simonka_bez_limitu
                name: Bez limitu do konca dňa
              - entity: input_number.simona_offset_tablet
                name: Nezapočítané (bez limitu)

          - type: grid
            columns: 3
            square: false
            cards:
              # Cas pribuda cez spolocny rozpocet: most potom tabletu sam
              # zvysi ciel. Priamy extra cas by pri zdielani most prepisal.
              - type: button
                name: +15 min
                icon: mdi:timer-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 15 }
              - type: button
                name: +30 min
                icon: mdi:timer-plus-outline
                tap_action:
                  action: perform-action
                  perform_action: script.simona_cas_pridaj
                  data: { minuty: 30 }
              - type: button
                name: Blok 30 min
                icon: mdi:timer-lock-outline
                tap_action:
                  action: perform-action
                  perform_action: mqtt.publish
                  data:
                    topic: timelimit/cmd
                    payload: '{"action":"block","child":"Simonka","minutes":30}'
                confirmation:
                  text: Zablokovať tablet na 30 minút?

          - type: heading
            heading: Kategórie
            heading_style: subtitle
            icon: mdi:shape-outline

          # "Allowed Apps" = vzdy povolene (bez pravidiel, vratane
          # .dummy.system_image = nezaradene systemove aplikacie).
          # "Ostatné aplikácie" = predvolena kategoria pre vsetko nezaradene:
          # 60 min denne po-pia, 180 min denne so-ne (perDay).
          - type: markdown
            content: >-
              **Allowed Apps** — povolené stále (aj nezaradené systémové
              aplikácie). **Ostatné aplikácie** — všetko ostatné: 60 min
              denne po–pia, 180 min denne so–ne.

          - type: entities
            entities:
              - entity: sensor.timelimit_simonka_ostatne_aplikacie_pouzite_dnes
                name: Ostatné – použité dnes
              - entity: switch.timelimit_simonka_ostatne_aplikacie_zablokovane
                name: Ostatné – zablokované
              - entity: sensor.timelimit_simonka_allowed_apps_pouzite_dnes
                name: Vždy povolené – použité dnes
              - entity: switch.timelimit_simonka_allowed_apps_zablokovane
                name: Vždy povolené – zablokované
              - type: section
                label: Ručne (pri zapnutom zdieľaní to HA prepíše)
              - entity: number.timelimit_simonka_ostatne_aplikacie_strop_na_dnes
                name: Ostatné – strop na dnes
              - entity: number.timelimit_simonka_ostatne_aplikacie_extra_cas_dnes
                name: Ostatné – extra čas dnes

          - type: heading
            heading: Vždy povolené aplikácie
            heading_style: subtitle
            icon: mdi:shield-check-outline

          - type: markdown
            content: >-
              {% set a = state_attr('sensor.timelimit_simonka_vzdy_povolene_aplikacie','apps') or [] %}

              {% set o = state_attr('sensor.timelimit_simonka_vzdy_povolene_aplikacie','other_apps') or {} %}

              Kategória **{{ state_attr('sensor.timelimit_simonka_vzdy_povolene_aplikacie','category') }}**
              nemá časové pravidlá — čo je v nej, ide vždy.


              <details><summary><b>{{ a | length }} aplikácií</b> — klikni pre zoznam</summary>

              {% if a %}{% for x in a %}{{ x }}<br>{% endfor %}{% else %}<i>zatiaľ nič</i>{% endif %}

              </details>

              {% for k, v in o.items() %}{% if v %}<details><summary>{{ k }}: {{ v | length }} priradených</summary>{{ v | join('<br>') }}</details>

              {% endif %}{% endfor %}


              <small>Zoznam nainštalovaných aplikácií posiela tablet šifrovane,
              HA vidí len balíky už priradené do kategórií. Nový balík zadaj
              menom (napr. `com.whatsapp`). Odobratá aplikácia padne do
              Ostatných aplikácií (limit 1 h / 3 h).</small>

          - type: entities
            entities:
              - entity: select.timelimit_simonka_odobrat_z_vzdy_povolenych
                name: Odobrať
              - entity: text.timelimit_simonka_pridat_balik_medzi_vzdy_povolene
                name: Pridať balík menom

          - type: entities
            entities:
              - entity: sensor.timelimit_zariadenie_iplay_50
                name: Na tablete prihlásený
              - entity: sensor.timelimit_most
                name: Most do TimeLimit
              - entity: button.timelimit_synchronizovat
                name: Synchronizovať teraz

      # -- Pocitac ------------------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Počítač
            heading_style: title
            icon: mdi:desktop-classic

          - type: entities
            entities:
              # binary_sensor.simona_pc_sedi (patch-prezencia.py) zatial nie je
              # nasadeny v HA - kym nebude, ukazujeme vzorku agenta.
              - entity: input_boolean.simona_pc_pouziva_sa
                name: Práve pri ňom sedí
              - entity: binary_sensor.simona_pc_online
                name: Spojenie s agentom (< 5 min)
              - entity: sensor.simona_pc_zapocitane
                name: Započítané dnes
              - entity: input_number.simona_pc_pouzite
                name: Namerané agentom
              - entity: input_number.simona_offset_pc
                name: Nezapočítané (bez limitu)
              - entity: sensor.simona_pc_povolene
                name: Smie spolu
              - entity: input_datetime.simona_pc_kontakt
                name: Posledný kontakt
              - entity: input_datetime.simona_pc_vstup
                name: Posledný dotyk myši/klávesnice
              - type: section
                label: Diagnostika spojenia
              - entity: input_number.simona_pc_latencia
                name: Latencia tiku (nad 1 s)
              - entity: input_number.simona_pc_lag_max
                name: Max meškanie tiku dnes
              - entity: counter.simona_pc_skok_zamietnuty
                name: Zamietnuté skoky spotreby

          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: Zamknúť
                icon: mdi:lock
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: lock }
              - type: button
                name: Uspať
                icon: mdi:power-sleep
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: sleep }
              - type: button
                name: Reštart
                icon: mdi:restart
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: restart }
                confirmation:
                  text: Reštartovať počítač?
              - type: button
                name: Vypnúť
                icon: mdi:power
                tap_action:
                  action: perform-action
                  perform_action: script.simona_pc_prikaz
                  data: { akcia: shutdown }
                confirmation:
                  text: Vypnúť počítač?

          - type: entities
            entities:
              - entity: input_number.simona_pc_snap_vypnutie
                name: Snímka pri vypnutí (−1 = dnes nevypínané)
              - entity: input_datetime.simona_pc_upozornenie
                name: Posledné upozornenie

          - type: markdown
            content: >-
              <small>Po vyčerpaní času sa počítač **raz vypne** — najprv
              varovanie nahlas a minúta na uloženie práce. Keď ho zapne znova,
              už doňho nesiahame: po **3 minútach** používania príde
              upozornenie na TV a do Telegramu.</small>
