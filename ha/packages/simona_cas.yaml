# ============================================================================
# Simona: ZDIELANY CASOVY ROZPOCET  (tablet iPlay 50 + PC 192.168.1.104)
#
# Myslienka: jeden vecer casu na den pre obe zariadenia dokopy.
#   R      = celkovy rozpocet na dnes (min), o polnoci z tyzdenneho rozvrhu
#   tablet = skutocne minuty na tablete (TimeLimit, kategoria s limitom)
#   pc     = skutocne minuty na PC (hlasi agent na porte 8799)
#
# HA obom stranam priebezne posuva ich strop:
#   ciel tabletu na dnes  :=  R - pc      -> most TimeLimit, appka zamkne tablet
#   povolene na PC        :=  R - tablet  -> agent uz len varuje
# Kazda strana tak vidi presne to, co jej po tej druhej zostalo. Prepocet
# bezi kazdu minutu, takze pri sucasnom hrani na oboch zariadeniach je
# odchylka nanajvys jedna-dve minuty a sama sa zrovna.
#
# Po vycerpani casu sa PC RAZ vypne - s hlasovym varovanim a minutou na
# ulozenie rozrobeneho. Ked ho potom zapne znova, uz do neho nesiahame:
# ked pri nom odsedi viac ako 3 minuty, ide len upozornenie na TV a
# Jakubovi do Telegramu.
#
# Rozvrh je v HA (input_number.simona_rozvrh_po ... _ne) a je to jediny
# zdroj pravdy: o polnoci sa z neho naplni rozpocet na dnes. Vlastne pravidla
# kategorie "Ostatné aplikácie" v appke TimeLimit (60 min po-pia, 180 min
# so-ne) su len zachranna siet pre pripad, ze HA alebo most nebezi.
#
# Strop tabletu: HA posiela mostu TimeLimit "cielovy cas na dnes" (mqtt
# timelimit/cmd, set_total) a most ho premieta do vlastneho pravidla HA
# a extra casu - viď ha/addons/timelimit/README.md.
#
# Fail-safe: ked minuty tabletu chybaju (most alebo server TimeLimit nebezi),
# strop tabletu NEMENIME - radsej ziadny zasah nez omylom nastaveny limit 0.
# ============================================================================

input_boolean:
  simona_zdielany_cas:
    name: Simona zdieľaný čas
    icon: mdi:scale-balance

  # Hlasi agent v kazdom ticku: sedi teraz niekto realne pri PC?
  simona_pc_pouziva_sa:
    name: Simona PC sa používa
    icon: mdi:account-clock

  # Rezim "bez limitu": cas sa neratá ani na jednom zariadeni.
  simona_bez_limitu:
    name: Simona bez limitu
    icon: mdi:infinity

input_number:
  # Tyzdenny rozvrh: kolko minut ma dieta na jednotlivy den. Je to jediny
  # zdroj pravdy o rozvrhu - o polnoci sa z neho naplni rozpocet na dnes.
  # Meni sa na dashboarde /simonka-cas (Týždenný rozvrh).
  #
  # Hodnoty sa NEsetuju cez 'initial' - to by ich prepisalo pri kazdom
  # restarte HA a rucna zmena by neprezila. Nastavuju sa raz sluzbou
  # input_number.set_value a dalej si ich HA pamata.
  simona_rozvrh_po:
    name: Simona rozvrh pondelok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_ut:
    name: Simona rozvrh utorok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_st:
    name: Simona rozvrh streda
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_stv:
    name: Simona rozvrh štvrtok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_pi:
    name: Simona rozvrh piatok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_so:
    name: Simona rozvrh sobota
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-weekend

  simona_rozvrh_ne:
    name: Simona rozvrh nedeľa
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-weekend

  simona_rozpocet_dnes:
    name: Simona rozpočet dnes
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:wallet-outline

  simona_pc_pouzite:
    name: Simona PC použité dnes
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:desktop-tower-monitor

  # Minuty, ktore sa nezapocitavaju - narastu vzdy o to, co pribudlo
  # pocas rezimu "bez limitu".
  simona_offset_tablet:
    name: Simona nezapočítané minúty tablet
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:tablet-cancel

  simona_offset_pc:
    name: Simona nezapočítané minúty PC
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:monitor-off

  # Stav v okamihu zapnutia rezimu, aby sme po vypnuti vedeli, kolko
  # minut medzitym pribudlo.
  simona_snap_tablet:
    name: Simona snímka tablet
    min: -1
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:camera-timer

  simona_snap_pc:
    name: Simona snímka PC
    min: -1
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:camera-timer

  # Kolko minut mal agent nameranych vo chvili, ked sme PC po limite vypli.
  # -1 = dnes sme este nevypinali. Od tejto hodnoty sa rataju tie 3 minuty,
  # po ktorych zacneme upozornovat.
  simona_pc_snap_vypnutie:
    name: Simona snímka pri vypnutí PC
    min: -1
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:power-off

  # -- Diagnostika tikov -----------------------------------------------------
  # Cas od spustenia triggera po navrat rest_command.pc_tick, v sekundach.
  # Zapisuje sa len nad 1 s: v necinnosti je median 0,02 s, pri hrani 0,51 s
  # (p95 3,7 s), takze 1 s presne oddeluje normal od anomalie. max 60 je 9x
  # nad pozorovanym maximom; sablona hodnotu orezava, takze presne 60 znamena
  # "mimo rozsahu". Orez je povinny - set_value mimo min/max zhodi beh.
  simona_pc_latencia:
    name: Simona PC latencia tiku
    min: 0
    max: 60
    step: 0.01
    mode: box
    unit_of_measurement: s
    icon: mdi:timer-outline

  # Najvacsie zmeskanie tiku agenta za dnesok (s). Hlasi ho agent 1.1.0 v poli
  # lag_max, HA berie maximum z oboch - tik s velkym meskanim casto padne na
  # timeout a po restarte agenta jeho vlastne maximum zacina od nuly.
  simona_pc_lag_max:
    name: Simona PC max meškanie tiku
    min: 0
    max: 3600
    step: 1
    mode: box
    unit_of_measurement: s
    icon: mdi:timer-alert-outline

# Kolko po sebe iducich tikov hlasilo spotrebu, ktora sa nedala stihnut.
# Prvy hodnoverny tik ho vynuluje; po treťom ide sprava do Telegramu.
counter:
  simona_pc_skok_zamietnuty:
    name: Simona PC zamietnuté skoky
    initial: 0
    step: 1
    icon: mdi:shield-alert-outline

input_datetime:
  simona_pc_kontakt:
    name: Simona PC posledný kontakt
    has_date: true
    has_time: true

  # Kedy naposledy islo upozornenie "sedi pri PC po limite". Drzime to v
  # helperi, nie cez last_triggered automatizacie - ten odkaz sa uz raz
  # ticho rozbil premenovanim.
  simona_pc_upozornenie:
    name: Simona PC posledné upozornenie
    has_date: true
    has_time: true

  # Kedy naposledy islo upozornenie "PC sa nehlasi" - vlastne skrtenie, nie
  # last_triggered (ten sa uz raz ticho rozbil premenovanim).
  simona_pc_ticho:
    name: Simona PC posledné upozornenie na ticho
    has_date: true
    has_time: true

  # Kedy sa naposledy dotkla mysi alebo klavesnice. Agent 1.1.0 posle idle_sec
  # a age_sec a HA z nich vyrata cas vstupu; pri starsom agentovi sa znacka
  # posuva vtedy, ked pribudne napocitana minuta (jediny dokaz pritomnosti,
  # ktory stary agent dava). Toto je jediny zdroj prezencie.
  simona_pc_vstup:
    name: Simona PC posledný vstup
    has_date: true
    has_time: true

  # Kedy sme na PC POSLALI prikaz na vypnutie - bez ohladu na to, ci ho PC
  # potvrdil. Skrti opakovane pokusy. 1970-01-01 znamena "dnes sme neskusali".
  # Vedome oddelene od simona_pc_snap_vypnutie: ta odteraz znamena vylucne
  # "PC naozaj zhaslo a od tychto minut ratame tie 3 minuty".
  simona_pc_vypnutie_pokus:
    name: Simona PC posledný pokus o vypnutie
    has_date: true
    has_time: true

# ---------------------------------------------------------------------------
# Vypocty
# ---------------------------------------------------------------------------
template:
  - sensor:
      # Surove minuty tabletu dnes z TimeLimit (pred odpocitanim
      # nezapocitanych). Len kategoria s limitom - Allowed Apps su povolene
      # stale a do spolocneho casu sa nerataju. Appka ich rata sama, takze su
      # nezavisle od toho, ako prave posuvame strop tabletu.
      - name: Simona tablet namerané
        unique_id: simona_tablet_namerane
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:tablet
        availability: "{{ has_value('sensor.timelimit_simonka_ostatne_aplikacie_pouzite_dnes') }}"
        state: "{{ states('sensor.timelimit_simonka_ostatne_aplikacie_pouzite_dnes') | int(0) }}"

      - name: Simona tablet použité
        unique_id: simona_tablet_pouzite
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:tablet
        availability: "{{ has_value('sensor.simona_tablet_namerane') }}"
        state: >-
          {% set raw = states('sensor.simona_tablet_namerane') | int(0) %}
          {% set off = states('input_number.simona_offset_tablet') | int(0) %}
          {% set snap = states('input_number.simona_snap_tablet') | int(-1) %}
          {% if is_state('input_boolean.simona_bez_limitu', 'on') and snap >= 0 %}
          {{ [ snap - off, 0 ] | max }}
          {% else %}
          {{ [ raw - off, 0 ] | max }}
          {% endif %}
        attributes:
          namerane: "{{ states('sensor.simona_tablet_namerane') | int(0) }}"
          nezapocitane: "{{ states('input_number.simona_offset_tablet') | int(0) }}"

      # Kolko minut ma rozvrh na dnesny (a zajtrajsi) den. now().weekday()
      # vracia 0 = pondelok ... 6 = nedela.
      - name: Simona rozvrh dnes
        unique_id: simona_rozvrh_dnes
        unit_of_measurement: min
        device_class: duration
        icon: mdi:calendar-clock
        state: >-
          {% set dni = ['po','ut','st','stv','pi','so','ne'] %}
          {{ states('input_number.simona_rozvrh_' ~ dni[now().weekday()]) | int(0) }}
        attributes:
          den: >-
            {{ ['pondelok','utorok','streda','štvrtok','piatok','sobota','nedeľa'][now().weekday()] }}
          zajtra: >-
            {% set dni = ['po','ut','st','stv','pi','so','ne'] %}
            {{ states('input_number.simona_rozvrh_' ~ dni[(now().weekday() + 1) % 7]) | int(0) }}

      # Celkovy dostupny cas na dnes. Pridany cas (Telegram, dashboard) sa
      # pripisuje priamo do rozpoctu na dnes, takze je to rovno R. Extra cas
      # v TimeLimit sa NEpripocitava - ten si most nastavuje sam ako sucast
      # ciela tabletu a zapocital by sa dvakrat.
      - name: Simona rozpočet celkom
        unique_id: simona_rozpocet_celkom
        unit_of_measurement: min
        device_class: duration
        icon: mdi:wallet-plus-outline
        state: "{{ states('input_number.simona_rozpocet_dnes') | int(0) }}"

      # To iste pre PC: agent hlasi namerane minuty, my z nich odpocitame
      # tie, ktore padli do rezimu "bez limitu".
      - name: Simona PC započítané
        unique_id: simona_pc_zapocitane
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:desktop-tower-monitor
        state: >-
          {% set raw = states('input_number.simona_pc_pouzite') | int(0) %}
          {% set off = states('input_number.simona_offset_pc') | int(0) %}
          {% set snap = states('input_number.simona_snap_pc') | int(-1) %}
          {% if is_state('input_boolean.simona_bez_limitu', 'on') and snap >= 0 %}
          {{ [ snap - off, 0 ] | max }}
          {% else %}
          {{ [ raw - off, 0 ] | max }}
          {% endif %}
        attributes:
          namerane: "{{ states('input_number.simona_pc_pouzite') | int(0) }}"
          nezapocitane: "{{ states('input_number.simona_offset_pc') | int(0) }}"

      - name: Simona čas použitý
        unique_id: simona_cas_pouzity
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand
        availability: "{{ has_value('sensor.simona_tablet_pouzite') }}"
        state: >-
          {{ (states('sensor.simona_tablet_pouzite') | int(0))
             + (states('sensor.simona_pc_zapocitane') | int(0)) }}
        attributes:
          tablet: "{{ states('sensor.simona_tablet_pouzite') | int(0) }}"
          pc: "{{ states('sensor.simona_pc_zapocitane') | int(0) }}"

      - name: Simona čas zostáva
        unique_id: simona_cas_zostava
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:timer-outline
        availability: "{{ has_value('sensor.simona_cas_pouzity') }}"
        state: >-
          {{ [ (states('sensor.simona_rozpocet_celkom') | int(0))
               - (states('sensor.simona_cas_pouzity') | int(0)), 0 ] | max }}

      # Ciel tabletu na dnes, ktory HA posiela mostu TimeLimit (set_total):
      # rozpocet minus PC, plus minuty nezapocitane v rezime bez limitu (appka
      # ich vidi ako pouzite, preto ich treba vratit).
      - name: Simona tablet cieľový limit
        unique_id: simona_tablet_cielovy_limit
        unit_of_measurement: min
        device_class: duration
        icon: mdi:tablet-dashboard
        availability: "{{ has_value('sensor.simona_tablet_pouzite') }}"
        state: >-
          {% if is_state('input_boolean.simona_bez_limitu', 'on') %}
          1440
          {% else %}
          {{ [ [ (states('input_number.simona_offset_tablet') | int(0))
                 + (states('input_number.simona_rozpocet_dnes') | int(0))
                 - (states('sensor.simona_pc_zapocitane') | int(0)), 0 ] | max, 1440 ] | min }}
          {% endif %}

      # Kolko celkovo smie dnes odsediet pri PC (vratane uz odsedeneho).
      - name: Simona PC povolené
        unique_id: simona_pc_povolene
        unit_of_measurement: min
        device_class: duration
        icon: mdi:monitor-lock
        availability: "{{ has_value('sensor.simona_tablet_pouzite') }}"
        state: >-
          {% if is_state('input_boolean.simona_bez_limitu', 'on') %}
          1440
          {% else %}
          {{ [ [ (states('input_number.simona_offset_pc') | int(0))
                 + (states('sensor.simona_rozpocet_celkom') | int(0))
                 - (states('sensor.simona_tablet_pouzite') | int(0)), 0 ] | max, 1440 ] | min }}
          {% endif %}

  - binary_sensor:
      - name: Simona PC online
        unique_id: simona_pc_online
        device_class: connectivity
        icon: mdi:desktop-classic
        state: >-
          {{ (as_timestamp(now()) - as_timestamp(states('input_datetime.simona_pc_kontakt'), 0)) < 300 }}

# ---------------------------------------------------------------------------
# Volanie agenta na PC. Odpoved: {"used": <minuty dnes>, "active": true/false}
# ---------------------------------------------------------------------------
rest_command:
  pc_tick:
    url: "http://192.168.1.104:8799/cmd"
    method: POST
    content_type: "application/json"
    # 20 s, nie 8: agent request dostane, ale pod zatazou odpoveda neskoro
    # a HA ju zahodi. Tretina periody tiku je bezpecna (mode: single).
    timeout: 20
    payload: >-
      {"token":"{{ pc_token }}","action":"tick","args":"{{ allowed }}"}

automation:
  # -- Polnocny start dna -----------------------------------------------------
  # Rozpocet na dnes berieme z TYZDENNEHO ROZVRHU v HA (input_number.simona_
  # rozvrh_*). Je to lokalna hodnota, takze vzdy existuje.
  #
  # Preco 00:06 a nie 00:00: agent na PC nuluje o 00:00 a most TimeLimit
  # ohlasi minuty noveho dna pri prvej synchronizacii po polnoci (raz za
  # minutu). O 00:06 su obe strany davno na novom dni, takze novy rozpocet
  # sa nikdy nestretne so vcerajsimi minutami (falosne "cas sa minul" a
  # vypnutie PC o polnoci). Do 00:06 HA tabletu ciel neposiela (viz
  # simona_cas_sync_tabletu_timelimit) a tablet ide podla zachrannej siete
  # appky.
  - id: simona_cas_polnocny_reset
    alias: "Simona čas: polnočný reset rozpočtu"
    mode: single
    triggers:
      - trigger: time
        at: "00:06:00"
    actions:
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.simona_pc_pouzite
            - input_number.simona_offset_tablet
            - input_number.simona_offset_pc
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.simona_snap_tablet
            - input_number.simona_snap_pc
            - input_number.simona_pc_snap_vypnutie
        data:
          value: -1
      # Rozpocet na novy den podla rozvrhu.
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: "{{ states('sensor.simona_rozvrh_dnes') | int(0) }}"

  # -- Rezim "bez limitu" ----------------------------------------------------
  # Pri zapnuti si odlozime, kde obe strany prave su. Merat nikomu
  # nezakazeme (ani sa neda), len si zapamatame, odkial dalej neratat.
  - id: simona_bez_limitu_zapnutie
    alias: "Simona čas: začiatok režimu bez limitu"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.simona_bez_limitu
        from: "off"
        to: "on"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_snap_tablet
        data:
          value: >-
            {{ states('sensor.simona_tablet_namerane') | int(0) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_snap_pc
        data:
          value: "{{ states('input_number.simona_pc_pouzite') | int(0) }}"

  # Pri vypnuti pripocitame do offsetu vsetko, co medzitym pribudlo -
  # zapocitana spotreba tak pokracuje presne tam, kde prestala.
  - id: simona_bez_limitu_vypnutie
    alias: "Simona čas: koniec režimu bez limitu"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.simona_bez_limitu
        from: "on"
        to: "off"
    conditions:
      # Snimka -1 znamena, ze rezim nebezal. Pri reload_all sa prepinac
      # obnovi ako "on" a hned prepne na "off" - bez tejto podmienky by
      # sme vtedy odpisali celu dnesnu spotrebu ako nezapocitanu.
      - condition: numeric_state
        entity_id: input_number.simona_snap_pc
        above: -1
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_offset_tablet
        data:
          value: >-
            {% set raw = states('sensor.simona_tablet_namerane') | int(0) %}
            {% set snap = states('input_number.simona_snap_tablet') | int(0) %}
            {{ [ (states('input_number.simona_offset_tablet') | int(0)) + [ raw - snap, 0 ] | max, 1440 ] | min }}
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_offset_pc
        data:
          value: >-
            {% set raw = states('input_number.simona_pc_pouzite') | int(0) %}
            {% set snap = states('input_number.simona_snap_pc') | int(0) %}
            {{ [ (states('input_number.simona_offset_pc') | int(0)) + [ raw - snap, 0 ] | max, 1440 ] | min }}
      # Snimky spat na -1, nech dalsi reload nema co odpisat.
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.simona_snap_tablet
            - input_number.simona_snap_pc
        data:
          value: -1

  # -- Strop tabletu cez TimeLimit --------------------------------------------
  # HA posle mostu "cielovy cas na dnes" = sensor.simona_tablet_cielovy_limit.
  # Most ho drzi (aj cez restart) a pri kazdej synchronizacii premieta do
  # vlastneho pravidla HA (strop appky zvysit nevie) a extra casu (to, co je
  # nad strop appky). Posielame pri zmene a raz za 5 minut pre istotu. Ked je
  # zdielany cas vypnuty, ciel zrusime (clear_total) a plati len rozvrh appky.
  # Ciel plati len na den, v ktory prisiel - vcerajsi ciel aj pravidlo HA
  # most po polnoci zahodi sam.
  #
  # Od 00:00 do 00:05 sa neposiela nic: PC je v noci vacsinou vypnute a do
  # resetu o 00:06 drzi vcerajsie minuty, ciel na novy den by tak mohol byt
  # prisnejsi (krajne 0). Tablet ide medzitym podla zachrannej siete appky;
  # prvy ciel noveho dna ide hned po resete (zmena ciela), poistne o 00:06:30.
  - id: simona_cas_sync_tabletu_timelimit
    alias: "Simona čas: strop tabletu cez TimeLimit"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - sensor.simona_tablet_cielovy_limit
          - input_boolean.simona_zdielany_cas
      - trigger: time_pattern
        minutes: "/5"
      - trigger: time
        at: "00:06:30"
    conditions:
      - condition: template
        value_template: "{{ not (now().hour == 0 and now().minute < 6) }}"
      - condition: template
        value_template: "{{ has_value('sensor.simona_tablet_cielovy_limit') }}"
    actions:
      - action: mqtt.publish
        data:
          topic: timelimit/cmd
          payload: >-
            {% if is_state('input_boolean.simona_zdielany_cas', 'on') %}
            {{ {'action': 'set_total', 'child': 'Simonka', 'category': 'Ostatné aplikácie',
                'minutes': states('sensor.simona_tablet_cielovy_limit') | int(0)} | to_json }}
            {% else %}
            {{ {'action': 'clear_total', 'child': 'Simonka', 'category': 'Ostatné aplikácie'} | to_json }}
            {% endif %}

  # -- Minutove spojenie s PC -------------------------------------------------
  # HA sa pyta agenta, agent odpovie kolko dnes odsedel a dostane svoj strop.
  # Ked je PC vypnuty, volanie ticho zlyha a posledna hodnota ostava platit.
  - id: simona_cas_pc_tick
    alias: "Simona čas: tick z PC"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      # ZACHRANNA SIET, nie hlavna cesta. Od verzie agenta 1.2.0 hlasi
      # agent sam (automatizacia simona_cas_pc_hlasenie nizsie) a tato vetva
      # sa spusti az vtedy, ked hlasenie nechodi viac nez 150 s - teda ked je
      # agent stary, zle nastaveny alebo mrtvy.
      #
      # Ked PC nebezi, skusame ho len raz za pat minut - inak by kazda
      # minuta vypnuteho PC pridala do logu jednu chybu spojenia.
      - condition: template
        value_template: >-
          {% set vek = as_timestamp(now())
                       - as_timestamp(states('input_datetime.simona_pc_kontakt'), 0) %}
          {{ vek > 150 and (vek < 600 or now().minute % 5 == 0) }}
    actions:
      - action: rest_command.pc_tick
        continue_on_error: true
        data:
          pc_token: !secret pc_agent_token
          allowed: "{{ states('sensor.simona_pc_povolene') | int(0) }}"
        response_variable: pc
      # Ked je PC vypnute, volanie ticho zlyha a 'pc' vobec nevznikne -
      # podmienka nas tu zastavi a posledna znama spotreba ostava platit.
      - condition: template
        value_template: >-
          {{ pc is defined and pc.content is defined and pc.content.used is defined }}
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_pc_pouzite
        data:
          # V ramci dna monotonne: pokles znamena, ze agent stratil stav
          # (state.json po tvrdom vypnuti), nie ze sa cas odsedel spat.
          # Vynimka su prve minuty po polnoci - agent resetuje o 00:00,
          # HA az o 00:06.
          value: >-
            {% set nove  = pc.content.used | int(0) %}
            {% set stare = states('input_number.simona_pc_pouzite') | int(0) %}
            {% if now().hour == 0 and now().minute < 10 %}
            {{ [ nove, 1440 ] | min }}
            {% else %}
            {{ [ [ nove, stare ] | max, 1440 ] | min }}
            {% endif %}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.simona_pc_kontakt
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: "input_boolean.turn_{{ 'on' if pc.content.active | default(false) else 'off' }}"
        target:
          entity_id: input_boolean.simona_pc_pouziva_sa

  # -- Hlasenie z PC (agent 1.2.0 a novsi) ------------------------------------
  # Obrateny smer: agent posiela sam, HA nic nezahadzuje. Telo hlasenia:
  #   {"used": 18, "idle_sec": 3, "age_sec": 0, "active": true,
  #    "allowed": 105, "version": "1.2.0", "needs_seed": false, "lag_max": 0}
  #
  # Vsetky zabrany su rovnake ako pri tiku - data z PC su nedoveryhodne v
  # oboch smeroch a webhook je navyse otvoreny komukolvek v LAN, kto pozna
  # jeho id. Preto: spotreba len monotonne a len do stropu, ktory sa dal
  # stihnut; znacka vstupu len z pasma platnych hodnot.
  - id: simona_cas_pc_hlasenie
    alias: "Simona čas: hlásenie z PC"
    mode: queued
    max: 5
    triggers:
      - trigger: webhook
        webhook_id: !secret simona_pc_webhook
        allowed_methods:
          - POST
        local_only: true
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: template
        value_template: "{{ trigger.json is defined and trigger.json.used is defined }}"
    actions:
      - variables:
          novy: >-
            {{ trigger.json.idle_sec is defined and trigger.json.age_sec is defined }}
          idle_ok: >-
            {{ (trigger.json.idle_sec | default(-1) | int(-1)) >= 0
               and (trigger.json.idle_sec | default(99999) | int(99999)) < 60
               and (trigger.json.age_sec | default(99999) | int(99999)) < 90 }}
          nove:  "{{ trigger.json.used | int(-1) }}"
          stare: "{{ states('input_number.simona_pc_pouzite') | int(0) }}"
          pred:  "{{ states('input_number.simona_pc_pouzite') | int(-1) }}"
          rast: "{{ pred >= 0 and (nove | int) > pred }}"
          sedi_teraz: "{{ idle_ok or ((not novy) and rast) }}"
          kontakt_ts: "{{ state_attr('input_datetime.simona_pc_kontakt', 'timestamp') | float(0) }}"
          odstup: >-
            {{ [ (now().timestamp() - kontakt_ts) | int, 0 ] | max if kontakt_ts > 0 else 86400 }}
          # Hlasenie chodi kazdych 30 s, takze +2 minuty rezervy staci aj na
          # jedno vynechane. Druhy strop je "kolko minut dnes vobec ubehlo".
          strop_skok: "{{ (odstup | int // 60) + 2 }}"
          strop_dnes: "{{ ((now() - today_at('00:00')).total_seconds() / 60) | int }}"
          povolene: "{{ [ (stare | int) + (strop_skok | int), strop_dnes | int ] | min }}"
          hodnoverne: >-
            {{ (nove | int) >= 0
               and ( (nove | int) <= (stare | int) or (nove | int) <= (povolene | int) ) }}
          strop_ha: "{{ states('sensor.simona_pc_povolene') | int(-1) }}"
          strop_agenta: "{{ trigger.json.allowed | default(-1) | int(-1) }}"

      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.simona_pc_kontakt
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      # Znacka vstupu PRED spotrebou - automatizacia po limite sa spusta na
      # zmenu spotreby a musi vidiet uz novu znacku.
      - if:
          - condition: template
            value_template: "{{ sedi_teraz }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.simona_pc_vstup
            data:
              datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - if:
          - condition: template
            value_template: "{{ novy and not idle_ok }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.simona_pc_vstup
            data:
              datetime: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d %H:%M:%S') }}"

      - action: "input_boolean.turn_{{ 'on' if trigger.json.active | default(false) else 'off' }}"
        target:
          entity_id: input_boolean.simona_pc_pouziva_sa

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ hodnoverne }}"
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.simona_pc_pouzite
                data:
                  value: >-
                    {% if now().hour == 0 and now().minute < 10 %}
                    {{ [ nove | int, 1440 ] | min }}
                    {% else %}
                    {{ [ [ nove | int, stare | int ] | max, 1440 ] | min }}
                    {% endif %}
              - if:
                  - condition: numeric_state
                    entity_id: counter.simona_pc_skok_zamietnuty
                    above: 0
                then:
                  - action: counter.reset
                    target:
                      entity_id: counter.simona_pc_skok_zamietnuty
        default:
          - action: counter.increment
            target:
              entity_id: counter.simona_pc_skok_zamietnuty
          - action: system_log.write
            data:
              level: warning
              logger: simona_cas
              message: >-
                PC hlasenie: zamietnuty skok pouzite {{ stare }} -> {{ nove }}
                (odstup {{ odstup }} s, povolene max {{ povolene }})

      # Odpoved smerom k PC. Posiela sa LEN ked sa strop naozaj lisi, takze v
      # ustalenom stave po sieti nechodi nic. Ked to zlyha, nic sa nedeje -
      # agent si podrzi posledny znamy strop a my mu ho posleme o 30 s znova.
      - if:
          - condition: template
            value_template: "{{ strop_ha >= 0 and strop_agenta != strop_ha }}"
        then:
          - action: rest_command.pc_cmd
            continue_on_error: true
            data:
              action: limit_set
              args: "{{ strop_ha }}"

      - action: input_number.set_value
        target:
          entity_id: input_number.simona_pc_lag_max
        data:
          value: >-
            {{ [ [ states('input_number.simona_pc_lag_max') | int(0),
                   trigger.json.lag_max | default(0) | int(0) ] | max, 3600 ] | min }}

  # -- Vypnutie PC po vycerpani casu ------------------------------------------
  # Po limite sa pocitac RAZ vypne. Nie hned a nie potichu: najprv hlasove a
  # textove varovanie a minuta na ulozenie rozrobeneho.
  #
  # Vypina sa raz za den. Ked ho potom Simonka znova zapne, uz do toho
  # nesiahame - vtedy chodia len upozornenia (automatizacia nizsie). Ked
  # rodic prida cas a ten sa znova minu, vypne sa znova (snimku vynuluje
  # simona_cas_pc_obnova_vypnutia).
  - id: simona_cas_pc_vypnutie_po_limite
    alias: "Simona čas: vypnúť PC po vyčerpaní času"
    mode: single
    max_exceeded: silent
    triggers:
      # cas sa prave minul
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 1
      # alebo bol uz minuty a ona PC prave zapla
      - trigger: state
        entity_id: binary_sensor.simona_pc_online
        from: "off"
        to: "on"
      - trigger: state
        entity_id: input_boolean.simona_pc_pouziva_sa
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: state
        entity_id: input_boolean.simona_bez_limitu
        state: "off"
      - condition: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 1
      # navrat zostatku z nedostupnosti (restart add-onu TimeLimit) nie je
      # "cas sa prave minul"
      - condition: template
        value_template: >-
          {{ trigger.platform != 'numeric_state'
             or (trigger.from_state is not none
                 and trigger.from_state.state not in ['unknown', 'unavailable']) }}
      # Ked PC nebezi, nie je co vypinat - vypne sa az ked ho zapne.
      - condition: state
        entity_id: binary_sensor.simona_pc_online
        state: "on"
      # -1 = dnes sme este nevypinali.
      - condition: numeric_state
        entity_id: input_number.simona_pc_snap_vypnutie
        below: 0
    actions:
      - action: rest_command.pc_cmd
        continue_on_error: true
        data:
          action: speak
          args: Simonka, čas na dnes sa minul. Počítač sa o minútu vypne, ulož si prácu.
      - action: rest_command.pc_cmd
        continue_on_error: true
        data:
          action: msg
          args: Čas na dnes sa minul - počítač sa o minútu vypne.
      - delay: "00:01:00"
      # Snimka az tesne pred vypnutim, nech sa tie 3 minuty po opatovnom
      # zapnuti rataju od skutocneho konca.
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_pc_snap_vypnutie
        data:
          value: "{{ states('input_number.simona_pc_pouzite') | int(0) }}"
      - action: rest_command.pc_cmd
        continue_on_error: true
        data:
          action: shutdown
          delay: 10
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 5756450012
          parse_mode: html
          message: >-
            🖥 Simonke sa minul čas, počítač som vypol
            (tablet {{ states('sensor.simona_tablet_pouzite') | int(0) }} +
            PC {{ states('input_number.simona_pc_pouzite') | int(0) }} z
            {{ states('sensor.simona_rozpocet_celkom') | int(0) }} min).

  # -- Novy cas rusi vypnutie -------------------------------------------------
  # Ked rodic prida cas, zacina sa odznova: az ked sa minie aj ten, PC sa
  # zase raz vypne.
  - id: simona_cas_pc_obnova_vypnutia
    alias: "Simona čas: nový čas ruší vypnutie PC"
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        above: 0
    conditions:
      - condition: numeric_state
        entity_id: input_number.simona_pc_snap_vypnutie
        above: -1
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_pc_snap_vypnutie
        data:
          value: -1

  # -- PC pouzity po tom, co sme ho vypli -------------------------------------
  # Uz do neho nesiahame. Ked ho zapne a odsedi pri nom viac ako 3 minuty,
  # chodi len upozornenie - na TV a Jakubovi do Telegramu.
  - id: simona_cas_pc_po_limite
    alias: "Simona čas: PC po vyčerpaní času"
    mode: single
    max_exceeded: silent
    triggers:
      # Agent hlasi kazdu minutu, ale hodnota sa zmeni len ked pri PC naozaj
      # pracuje - necinnost sa neraáta.
      - trigger: state
        entity_id: input_number.simona_pc_pouzite
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: state
        entity_id: input_boolean.simona_bez_limitu
        state: "off"
      - condition: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 1
      - condition: state
        entity_id: input_boolean.simona_pc_pouziva_sa
        state: "on"
      # Az ked uz raz po limite vypnuty bol ...
      - condition: numeric_state
        entity_id: input_number.simona_pc_snap_vypnutie
        above: -1
      # ... a od vtedy pri nom odsedela viac ako 3 minuty.
      - condition: template
        value_template: >-
          {{ (states('input_number.simona_pc_pouzite') | int(0))
             - (states('input_number.simona_pc_snap_vypnutie') | int(0)) > 3 }}
      # Kym pri nom sedi, pripomenieme sa najviac raz za pol hodinu.
      # POZOR: predtym tu bol odkaz na automation.simona_cas_pc_po_limite,
      # lenze alias sa sluguje na automation.simona_cas_pc_po_vycerpani_casu.
      # Entita neexistovala, as_timestamp(None, 0) = 0 a podmienka bola vzdy
      # splnena - skrtenie teda nikdy nefungovalo. Preto vlastny helper.
      - condition: template
        value_template: >-
          {{ (as_timestamp(now())
              - as_timestamp(states('input_datetime.simona_pc_upozornenie'), 0)) > 1800 }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.simona_pc_upozornenie
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      # Telegram ide PRVY - je to kanal, ktory musi dojst. Az potom TV,
      # a to cez script.turn_on, aby jej pripadna chyba zostala v skripte.
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 5756450012
          message: "Simonka si zapla počítač napriek tomu, že už ho nemá používať!!! Choď to vyriešiť!!!"
      - action: script.turn_on
        target:
          entity_id: script.simona_tv_oznam
        data:
          variables:
            sprava: "Simonka si zapla počítač napriek tomu, že už ho nemá používať!!! Choď to vyriešiť!!!"

  # -- PC zmizol zo siete -----------------------------------------------------
  # Bez tohto ostava priznak "pouziva sa" zapnuty aj hodiny po vypnuti PC
  # (6. 9. od 10:02 do 13:58 UTC, zhaslo to az rucne). Ziadne nove cislo:
  # je to tych istych 300 s zo senzora "PC online".
  - id: simona_cas_pc_offline_zhasni
    alias: "Simona čas: PC offline → zhasnúť používa sa"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.simona_pc_online
        to: "off"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.simona_pc_pouziva_sa

  # -- PC sa prestal hlasit ---------------------------------------------------
  # Prah 10 minut stavu offline = 15 minut uplneho ticha (senzor ma vlastnu
  # 300 s hysterezu). Bezne medzery medzi tikmi su 1-3 minuty, cely restart
  # po vypadku napajania trval 5 minut ticha. 13. 9. bol PC zapnuty od 14:03
  # a prvy tik dosiel az 14:25 - tato sprava by bola prisla o 14:15.
  #
  # from: "on" je zamerne: celodenne vypnuty PC sedi na "off" a ziadny
  # prechod nevyrobi, takze nechodi nic.
  - id: simona_cas_pc_ticho
    alias: "Simona čas: PC sa prestal hlásiť"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.simona_pc_online
        from: "on"
        to: "off"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      # Ked sa cas nerata, mlciaci agent nic nestoji.
      - condition: state
        entity_id: input_boolean.simona_bez_limitu
        state: "off"
      # Dnes sa aspon raz ozval - inak by sprava chodila aj po restarte HA.
      - condition: template
        value_template: >-
          {{ states('input_datetime.simona_pc_kontakt')[:10] == now().strftime('%Y-%m-%d') }}
      - condition: time
        after: "07:00:00"
        before: "21:00:00"
      # Najviac jedna sprava za hodinu.
      - condition: template
        value_template: >-
          {{ (as_timestamp(now())
              - as_timestamp(states('input_datetime.simona_pc_ticho'), 0)) > 3600 }}
    actions:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.simona_pc_ticho
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - variables:
          ticho: >-
            {{ ((as_timestamp(now())
                 - as_timestamp(states('input_datetime.simona_pc_kontakt'), 0)) / 60) | round(0) }}
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 5756450012
          parse_mode: html
          message: >-
            ⚠️ <b>Simonkin počítač sa nehlási {{ ticho }} min.</b>
            Posledný kontakt {{ states('input_datetime.simona_pc_kontakt')[11:16] }},
            napočítaných {{ states('input_number.simona_pc_pouzite') | int(0) }} min.
            Buď ho vypla, alebo zamrzol agent (úloha HA-PcAgent na PC). Prehľad: /cas

  # -- Upozornenia rodicom ----------------------------------------------------
  - id: simona_cas_varovania
    alias: "Simona čas: upozornenia do Telegramu"
    mode: queued
    max: 5
    triggers:
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 31
        above: 29
        id: "30"
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 11
        above: 9
        id: "10"
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 1
        id: "0"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: state
        entity_id: input_boolean.simona_bez_limitu
        state: "off"
      # navrat z nedostupnosti (restart add-onu TimeLimit) nie je prekrocenie
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable'] }}
    actions:
      - variables:
          sprava: >-
            {% set t = states('sensor.simona_tablet_pouzite') | int(0) %}
            {% set p = states('sensor.simona_pc_zapocitane') | int(0) %}
            {% if trigger.id == '0' %}⛔ Simonke sa minul spoločný čas
            {% else %}⏳ Simonke zostáva {{ trigger.id }} min spoločného času
            {% endif %}(tablet {{ t }} + PC {{ p }} z {{ states('sensor.simona_rozpocet_celkom') | int(0) }} min).
      - repeat:
          for_each: ["5756450012", "8413756301"]
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: "{{ repeat.item }}"
                parse_mode: html
                message: "{{ sprava }}"

# ---------------------------------------------------------------------------
# Akcie pre dashboard (tlacidla potrebuju sluzbu s parametrom)
# ---------------------------------------------------------------------------
script:
  # Prekrytie na TV. Volat VZDY cez script.turn_on, nie priamo - vtedy bezi
  # ako samostatny beh a ked je TV vypnuta, chyba nezhodi volajuceho.
  # continue_on_error tu nestaci: notify prepusti surovu aiohttp chybu,
  # ktoru HA nezachytava.
  simona_tv_oznam:
    alias: "Simona: prekrytie na TV"
    icon: mdi:television
    mode: queued
    max: 5
    fields:
      sprava:
        name: Správa
        required: true
      titulok:
        name: Titulok
        required: false
    sequence:
      - action: notify.tvoverlaynotify
        continue_on_error: true
        data:
          title: "{{ titulok | default('🖥 Počítač', true) }}"
          message: "{{ sprava }}"
          data:
            appTitle: Rodičovský dohľad
            color: "#e8a33d"
            seconds: 30

  simona_cas_pridaj:
    alias: "Simona čas: pridaj minúty"
    icon: mdi:clock-plus-outline
    mode: queued
    max: 5
    fields:
      minuty:
        name: Minúty
        required: true
        selector:
          number:
            min: 1
            max: 240
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: >-
            {{ [ (states('input_number.simona_rozpocet_dnes') | int(0)) + (minuty | int(0)), 1440 ] | min }}

  simona_cas_nastav:
    alias: "Simona čas: nastav rozpočet"
    icon: mdi:wallet-outline
    mode: queued
    max: 5
    fields:
      minuty:
        name: Minúty
        required: true
        selector:
          number:
            min: 0
            max: 1440
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: "{{ [ minuty | int(0), 1440 ] | min }}"

  # Zroluje rozpocet na uz spotrebovane - tablet sa tym hned zamkne,
  # PC sa neblokuje, len o tom pride upozornenie.
  simona_cas_ukonci:
    alias: "Simona čas: ukonči teraz"
    icon: mdi:timer-off-outline
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: "{{ states('sensor.simona_cas_pouzity') | int(0) }}"

  # Preposle prikaz agentovi na PC (rovnaky kanal ako Telegram menu).
  simona_pc_prikaz:
    alias: "Simona PC: pošli príkaz"
    icon: mdi:desktop-classic
    mode: queued
    max: 5
    fields:
      akcia:
        name: Akcia
        required: true
        selector:
          select:
            options: [lock, sleep, logoff, shutdown, restart, cancel, mute, unmute]
    sequence:
      - action: rest_command.pc_cmd
        continue_on_error: true
        data:
          action: "{{ akcia }}"
          args: ""
