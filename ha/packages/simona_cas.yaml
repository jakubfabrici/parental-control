# ============================================================================
# Simona: ZDIELANY CASOVY ROZPOCET  (tablet iPlay_50 + PC 192.168.1.104)
#
# Myslienka: jeden vecer casu na den pre obe zariadenia dokopy.
#   R      = celkovy rozpocet na dnes (min), preberany z rozvrhu Family Link
#   tablet = skutocne minuty na tablete (Family Link ich uz rata sam)
#   pc     = skutocne minuty na PC (hlasi agent na porte 8799)
#
# HA obom stranam priebezne posuva ich strop:
#   FL denny limit tabletu  :=  R - pc              -> Family Link zamkne tablet
#   povolene na PC          :=  R + bonus - tablet  -> agent uz len varuje
# Kazda strana tak vidi presne to, co jej po tej druhej zostalo. Prepocet
# bezi kazdu minutu, takze pri sucasnom hrani na oboch zariadeniach je
# odchylka nanajvys jedna-dve minuty a sama sa zrovna.
#
# PC sa NIJAKO neblokuje - to je zamer, nie chybajuca funkcia. Simonka sa ma
# vediet zastavit sama; ked si po vycerpanom case sadne k PC, len o tom dame
# vediet (prekrytie na TV + Telegram Jakubovi).
#
# Rozvrh je v HA (input_number.simona_rozvrh_po ... _ne) ako kopia rozvrhu
# z Family Link - ten sa cez integraciu vycitat NEDA, coordinator sprístupnuje
# len appliedTimeLimits (hodnotu platnu na dnes, vratane nasho override).
# Citat rozpocet odtial bola chyba: kazde rano sme precitali vlastny vcerajsi
# zvysok a rozpocet sa scvrkaval. Zapis limitu ide cez endpoint
# timeLimitOverrides:batchCreate, teda je to override na DNESNY den -
# tyzdenny rozvrh v Google sa nemeni. O 23:57 ho vraciame na hodnotu rozvrhu,
# aby po nas nezostal ziadny override.
#
# Fail-safe: ked Family Link data chybaju (unavailable), NEMENIME nic -
# radsej ziadny zasah nez omylom nastaveny limit 0.
# ============================================================================

input_boolean:
  simona_zdielany_cas:
    name: Simona zdieľaný čas
    icon: mdi:scale-balance

  # Hlasi agent v kazdom ticku: sedi teraz niekto realne pri PC?
  simona_pc_pouziva_sa:
    name: Simona PC sa používa
    icon: mdi:account-clock

  # Rezim "bez limitu": cas sa neratá ani na jednom zariadeni.
  simona_bez_limitu:
    name: Simona bez limitu
    icon: mdi:infinity

input_number:
  # Tyzdenny rozvrh: kolko minut ma dieta na jednotlivy den. Je to KOPIA
  # rozvrhu z Family Link - ten sa cez integraciu vycitat neda (coordinator
  # cita len appliedTimeLimits, teda hodnotu platnu na dnes, do ktorej sme
  # sami zapisali override). Ked sa rozvrh vo Family Link zmeni, treba ho
  # prepisat aj tu.
  #
  # Hodnoty sa NEsetuju cez 'initial' - to by ich prepisalo pri kazdom
  # restarte HA a rucna zmena by neprezila. Nastavuju sa raz sluzbou
  # input_number.set_value a dalej si ich HA pamata.
  simona_rozvrh_po:
    name: Simona rozvrh pondelok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_ut:
    name: Simona rozvrh utorok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_st:
    name: Simona rozvrh streda
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_stv:
    name: Simona rozvrh štvrtok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_pi:
    name: Simona rozvrh piatok
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-clock

  simona_rozvrh_so:
    name: Simona rozvrh sobota
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-weekend

  simona_rozvrh_ne:
    name: Simona rozvrh nedeľa
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:calendar-weekend

  simona_rozpocet_dnes:
    name: Simona rozpočet dnes
    min: 0
    max: 1440
    step: 5
    mode: box
    unit_of_measurement: min
    icon: mdi:wallet-outline

  simona_pc_pouzite:
    name: Simona PC použité dnes
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:desktop-tower-monitor

  # Minuty, ktore sa nezapocitavaju - narastu vzdy o to, co pribudlo
  # pocas rezimu "bez limitu".
  simona_offset_tablet:
    name: Simona nezapočítané minúty tablet
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:tablet-cancel

  simona_offset_pc:
    name: Simona nezapočítané minúty PC
    min: 0
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:monitor-off

  # Stav v okamihu zapnutia rezimu, aby sme po vypnuti vedeli, kolko
  # minut medzitym pribudlo.
  simona_snap_tablet:
    name: Simona snímka tablet
    min: -1
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:camera-timer

  simona_snap_pc:
    name: Simona snímka PC
    min: -1
    max: 1440
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:camera-timer

input_datetime:
  simona_pc_kontakt:
    name: Simona PC posledný kontakt
    has_date: true
    has_time: true

# ---------------------------------------------------------------------------
# Vypocty
# ---------------------------------------------------------------------------
template:
  - sensor:
      # Skutocne minuty na tablete dnes. Family Link ich rata sam, my ich len
      # citame - su nezavisle od toho, ako prave posuvame denny limit.
      - name: Simona tablet použité
        unique_id: simona_tablet_pouzite
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:tablet
        availability: "{{ has_value('sensor.iplay_50_screen_time_remaining') }}"
        state: >-
          {% set raw = state_attr('sensor.iplay_50_screen_time_remaining', 'used_minutes') | int(0) %}
          {% set off = states('input_number.simona_offset_tablet') | int(0) %}
          {% set snap = states('input_number.simona_snap_tablet') | int(-1) %}
          {% if is_state('input_boolean.simona_bez_limitu', 'on') and snap >= 0 %}
          {{ [ snap - off, 0 ] | max }}
          {% else %}
          {{ [ raw - off, 0 ] | max }}
          {% endif %}
        attributes:
          namerane: "{{ state_attr('sensor.iplay_50_screen_time_remaining', 'used_minutes') | int(0) }}"
          nezapocitane: "{{ states('input_number.simona_offset_tablet') | int(0) }}"

      # Kolko minut ma rozvrh na dnesny (a zajtrajsi) den. now().weekday()
      # vracia 0 = pondelok ... 6 = nedela.
      - name: Simona rozvrh dnes
        unique_id: simona_rozvrh_dnes
        unit_of_measurement: min
        device_class: duration
        icon: mdi:calendar-clock
        state: >-
          {% set dni = ['po','ut','st','stv','pi','so','ne'] %}
          {{ states('input_number.simona_rozvrh_' ~ dni[now().weekday()]) | int(0) }}
        attributes:
          den: >-
            {{ ['pondelok','utorok','streda','štvrtok','piatok','sobota','nedeľa'][now().weekday()] }}
          zajtra: >-
            {% set dni = ['po','ut','st','stv','pi','so','ne'] %}
            {{ states('input_number.simona_rozvrh_' ~ dni[(now().weekday() + 1) % 7]) | int(0) }}

      # Celkovy dostupny cas na dnes. Bonus pridany priamo v aplikacii Family
      # Link sa pripocitava - rodic tym vedome zvacsil vecer.
      - name: Simona rozpočet celkom
        unique_id: simona_rozpocet_celkom
        unit_of_measurement: min
        device_class: duration
        icon: mdi:wallet-plus-outline
        state: >-
          {{ (states('input_number.simona_rozpocet_dnes') | int(0))
             + (states('sensor.iplay_50_active_bonus') | int(0)) }}

      # To iste pre PC: agent hlasi namerane minuty, my z nich odpocitame
      # tie, ktore padli do rezimu "bez limitu".
      - name: Simona PC započítané
        unique_id: simona_pc_zapocitane
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:desktop-tower-monitor
        state: >-
          {% set raw = states('input_number.simona_pc_pouzite') | int(0) %}
          {% set off = states('input_number.simona_offset_pc') | int(0) %}
          {% set snap = states('input_number.simona_snap_pc') | int(-1) %}
          {% if is_state('input_boolean.simona_bez_limitu', 'on') and snap >= 0 %}
          {{ [ snap - off, 0 ] | max }}
          {% else %}
          {{ [ raw - off, 0 ] | max }}
          {% endif %}
        attributes:
          namerane: "{{ states('input_number.simona_pc_pouzite') | int(0) }}"
          nezapocitane: "{{ states('input_number.simona_offset_pc') | int(0) }}"

      - name: Simona čas použitý
        unique_id: simona_cas_pouzity
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand
        availability: "{{ has_value('sensor.simona_tablet_pouzite') }}"
        state: >-
          {{ (states('sensor.simona_tablet_pouzite') | int(0))
             + (states('sensor.simona_pc_zapocitane') | int(0)) }}
        attributes:
          tablet: "{{ states('sensor.simona_tablet_pouzite') | int(0) }}"
          pc: "{{ states('sensor.simona_pc_zapocitane') | int(0) }}"

      - name: Simona čas zostáva
        unique_id: simona_cas_zostava
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:timer-outline
        availability: "{{ has_value('sensor.simona_cas_pouzity') }}"
        state: >-
          {{ [ (states('sensor.simona_rozpocet_celkom') | int(0))
               - (states('sensor.simona_cas_pouzity') | int(0)), 0 ] | max }}

      # Strop, ktory ma mat tablet vo Family Link. Bonus sem NEpatri - Family
      # Link si ho pripocitava k limitu sam, inak by sa zapocital dvakrat.
      - name: Simona tablet cieľový limit
        unique_id: simona_tablet_cielovy_limit
        unit_of_measurement: min
        device_class: duration
        icon: mdi:tablet-dashboard
        availability: "{{ has_value('sensor.simona_tablet_pouzite') }}"
        state: >-
          {% if is_state('input_boolean.simona_bez_limitu', 'on') %}
          1440
          {% else %}
          {{ [ [ (states('input_number.simona_offset_tablet') | int(0))
                 + (states('input_number.simona_rozpocet_dnes') | int(0))
                 - (states('sensor.simona_pc_zapocitane') | int(0)), 0 ] | max, 1440 ] | min }}
          {% endif %}

      # Kolko celkovo smie dnes odsediet pri PC (vratane uz odsedeneho).
      - name: Simona PC povolené
        unique_id: simona_pc_povolene
        unit_of_measurement: min
        device_class: duration
        icon: mdi:monitor-lock
        availability: "{{ has_value('sensor.simona_tablet_pouzite') }}"
        state: >-
          {% if is_state('input_boolean.simona_bez_limitu', 'on') %}
          1440
          {% else %}
          {{ [ [ (states('input_number.simona_offset_pc') | int(0))
                 + (states('sensor.simona_rozpocet_celkom') | int(0))
                 - (states('sensor.simona_tablet_pouzite') | int(0)), 0 ] | max, 1440 ] | min }}
          {% endif %}

  - binary_sensor:
      - name: Simona PC online
        unique_id: simona_pc_online
        device_class: connectivity
        icon: mdi:desktop-classic
        state: >-
          {{ (as_timestamp(now()) - as_timestamp(states('input_datetime.simona_pc_kontakt'), 0)) < 300 }}

# ---------------------------------------------------------------------------
# Volanie agenta na PC. Odpoved: {"used": <minuty dnes>, "active": true/false}
# ---------------------------------------------------------------------------
rest_command:
  pc_tick:
    url: "http://192.168.1.104:8799/cmd"
    method: POST
    content_type: "application/json"
    timeout: 8
    payload: >-
      {"token":"{{ pc_token }}","action":"tick","args":"{{ allowed }}"}

automation:
  # -- Polnocny start dna -----------------------------------------------------
  # Rozpocet na dnes berieme z TYZDENNEHO ROZVRHU v HA (input_number.simona_
  # rozvrh_*), nie z Family Link.
  #
  # Predtym sa cital sensor.iplay_50_daily_limit - a to bola chyba: integracia
  # do neho dava hodnotu platnu na dnes, teda vratane override, ktory sme tam
  # cez den sami zapisali. Rano sme si tak precitali vlastny vcerajsi zvysok
  # a rozpocet sa den po dni scvrkaval (180 -> 75 -> 61). Tyzdenny rozvrh sa
  # z Family Link vycitat neda, preto je jeho kopia tu.
  - id: simona_cas_polnocny_reset
    alias: "Simona čas: polnočný reset rozpočtu"
    mode: single
    triggers:
      - trigger: time
        at: "00:05:00"
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.iplay_50_daily_limit
            - sensor.iplay_50_screen_time_remaining
      - delay: "00:00:20"
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.simona_pc_pouzite
            - input_number.simona_offset_tablet
            - input_number.simona_offset_pc
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.simona_snap_tablet
            - input_number.simona_snap_pc
        data:
          value: -1
      # Rozpocet na novy den podla rozvrhu. Je to lokalna hodnota, takze
      # vzdy existuje - nic tu nemoze zlyhat na nedostupnom Google API.
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: "{{ states('sensor.simona_rozvrh_dnes') | int(0) }}"

  # -- Rezim "bez limitu" ----------------------------------------------------
  # Pri zapnuti si odlozime, kde obe strany prave su. Merat nikomu
  # nezakazeme (ani sa neda), len si zapamatame, odkial dalej neratat.
  - id: simona_bez_limitu_zapnutie
    alias: "Simona čas: začiatok režimu bez limitu"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.simona_bez_limitu
        from: "off"
        to: "on"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_snap_tablet
        data:
          value: >-
            {{ state_attr('sensor.iplay_50_screen_time_remaining', 'used_minutes') | int(0) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_snap_pc
        data:
          value: "{{ states('input_number.simona_pc_pouzite') | int(0) }}"

  # Pri vypnuti pripocitame do offsetu vsetko, co medzitym pribudlo -
  # zapocitana spotreba tak pokracuje presne tam, kde prestala.
  - id: simona_bez_limitu_vypnutie
    alias: "Simona čas: koniec režimu bez limitu"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.simona_bez_limitu
        from: "on"
        to: "off"
    conditions:
      # Snimka -1 znamena, ze rezim nebezal. Pri reload_all sa prepinac
      # obnovi ako "on" a hned prepne na "off" - bez tejto podmienky by
      # sme vtedy odpisali celu dnesnu spotrebu ako nezapocitanu.
      - condition: numeric_state
        entity_id: input_number.simona_snap_pc
        above: -1
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_offset_tablet
        data:
          value: >-
            {% set raw = state_attr('sensor.iplay_50_screen_time_remaining', 'used_minutes') | int(0) %}
            {% set snap = states('input_number.simona_snap_tablet') | int(0) %}
            {{ [ (states('input_number.simona_offset_tablet') | int(0)) + [ raw - snap, 0 ] | max, 1440 ] | min }}
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_offset_pc
        data:
          value: >-
            {% set raw = states('input_number.simona_pc_pouzite') | int(0) %}
            {% set snap = states('input_number.simona_snap_pc') | int(0) %}
            {{ [ (states('input_number.simona_offset_pc') | int(0)) + [ raw - snap, 0 ] | max, 1440 ] | min }}
      # Snimky spat na -1, nech dalsi reload nema co odpisat.
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.simona_snap_tablet
            - input_number.simona_snap_pc
        data:
          value: -1

  # -- Prepocet stropu pre tablet --------------------------------------------
  # Bezi po kazdej zmene spotreby. Google API volame len ked sa cielova
  # hodnota naozaj lisi od aktualnej, aby sme ho nebombardovali.
  - id: simona_cas_sync_tabletu
    alias: "Simona čas: zosúladiť limit tabletu"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id:
          - sensor.simona_tablet_cielovy_limit
          - input_number.simona_pc_pouzite
          - input_number.simona_rozpocet_dnes
      - trigger: time_pattern
        minutes: "/5"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: template
        value_template: "{{ has_value('sensor.simona_tablet_cielovy_limit') }}"
      - condition: template
        value_template: "{{ has_value('sensor.iplay_50_daily_limit') }}"
      - condition: template
        value_template: >-
          {{ (states('sensor.simona_tablet_cielovy_limit') | int(-1))
             != (states('sensor.iplay_50_daily_limit') | int(-2)) }}
    actions:
      - action: familylink.set_daily_limit
        data:
          entity_id: switch.iplay_50
          daily_minutes: "{{ states('sensor.simona_tablet_cielovy_limit') | int }}"

  # -- Minutove spojenie s PC -------------------------------------------------
  # HA sa pyta agenta, agent odpovie kolko dnes odsedel a dostane svoj strop.
  # Ked je PC vypnuty, volanie ticho zlyha a posledna hodnota ostava platit.
  - id: simona_cas_pc_tick
    alias: "Simona čas: tick z PC"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      # Ked PC nebezi, skusame ho len raz za pat minut - inak by kazda
      # minuta vypnuteho PC pridala do logu jednu chybu spojenia.
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.simona_pc_online', 'on') or now().minute % 5 == 0 }}
    actions:
      - action: rest_command.pc_tick
        continue_on_error: true
        data:
          pc_token: !secret pc_agent_token
          allowed: "{{ states('sensor.simona_pc_povolene') | int(0) }}"
        response_variable: pc
      # Ked je PC vypnute, volanie ticho zlyha a 'pc' vobec nevznikne -
      # podmienka nas tu zastavi a posledna znama spotreba ostava platit.
      - condition: template
        value_template: >-
          {{ pc is defined and pc.content is defined and pc.content.used is defined }}
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_pc_pouzite
        data:
          value: "{{ [ pc.content.used | int(0), 1440 ] | min }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.simona_pc_kontakt
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: "input_boolean.turn_{{ 'on' if pc.content.active | default(false) else 'off' }}"
        target:
          entity_id: input_boolean.simona_pc_pouziva_sa

  # -- Vecerne upratanie ------------------------------------------------------
  # Override vratime na hodnotu z ROZVRHU (nie na rozpocet - ten mohol byt
  # cez den rucne zvyseny a to bola vynimka len na dnes), nech po nas v
  # Google nezostane nic, co by ovplyvnilo dalsie dni.
  - id: simona_cas_vecerne_upratanie
    alias: "Simona čas: vrátiť limit podľa rozvrhu"
    mode: single
    triggers:
      - trigger: time
        at: "23:57:00"
    conditions:
      - condition: template
        value_template: >-
          {{ has_value('sensor.iplay_50_daily_limit')
             and (states('sensor.iplay_50_daily_limit') | int(-1))
                 != (states('sensor.simona_rozvrh_dnes') | int(-2)) }}
    actions:
      - action: familylink.set_daily_limit
        data:
          entity_id: switch.iplay_50
          daily_minutes: "{{ states('sensor.simona_rozvrh_dnes') | int }}"

  # -- PC pouzity po vycerpani casu -------------------------------------------
  # PC sa zamerne NIJAKO neblokuje - Simonka sa ma rozhodnut sama. Ked si po
  # vycerpanom case sadne k PC, len o tom dame vediet: prekrytie na TV a
  # sprava Jakubovi do Telegramu. Aby to pri dlhsom sedeni nespamovalo,
  # opakuje sa najviac raz za pol hodinu.
  - id: simona_cas_pc_po_limite
    alias: "Simona čas: PC po vyčerpaní času"
    mode: single
    max_exceeded: silent
    triggers:
      # zapla PC (agent sa ohlasil po tom, co bol dlho ticho)
      - trigger: state
        entity_id: binary_sensor.simona_pc_online
        from: "off"
        to: "on"
      # zacala pri nom realne robit
      - trigger: state
        entity_id: input_boolean.simona_pc_pouziva_sa
        from: "off"
        to: "on"
      # sedi pri nom dalej - pripomenieme sa
      - trigger: state
        entity_id: input_boolean.simona_pc_pouziva_sa
        to: "on"
        for: "00:30:00"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: state
        entity_id: input_boolean.simona_bez_limitu
        state: "off"
      - condition: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 1
      - condition: template
        value_template: >-
          {{ (as_timestamp(now())
              - as_timestamp(state_attr('automation.simona_cas_pc_po_limite', 'last_triggered'), 0)) > 1800 }}
    actions:
      - variables:
          text: >-
            Simonka je pri PC, hoci má na dnes vyčerpaný čas
            (tablet {{ states('sensor.simona_tablet_pouzite') | int(0) }} +
            PC {{ states('input_number.simona_pc_pouzite') | int(0) }} z
            {{ states('sensor.simona_rozpocet_celkom') | int(0) }} min).
      # Posielame vzdy. Ked je TV vypnuta, volanie zlyha a pokracuje sa
      # dalej na Telegram - preto continue_on_error.
      - action: notify.tvoverlaynotify
        continue_on_error: true
        data:
          title: "🖥 Simonka pri PC"
          message: "{{ text }}"
          data:
            appTitle: Rodičovský dohľad
            color: "#e8a33d"
            seconds: 30
      - action: telegram_bot.send_message
        continue_on_error: true
        data:
          chat_id: 5756450012
          parse_mode: html
          message: "🖥 {{ text }}"

  # -- Upozornenia rodicom ----------------------------------------------------
  - id: simona_cas_varovania
    alias: "Simona čas: upozornenia do Telegramu"
    mode: queued
    max: 5
    triggers:
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 31
        above: 29
        id: "30"
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 11
        above: 9
        id: "10"
      - trigger: numeric_state
        entity_id: sensor.simona_cas_zostava
        below: 1
        id: "0"
    conditions:
      - condition: state
        entity_id: input_boolean.simona_zdielany_cas
        state: "on"
      - condition: state
        entity_id: input_boolean.simona_bez_limitu
        state: "off"
    actions:
      - variables:
          sprava: >-
            {% set t = states('sensor.simona_tablet_pouzite') | int(0) %}
            {% set p = states('input_number.simona_pc_pouzite') | int(0) %}
            {% if trigger.id == '0' %}⛔ Simonke sa minul spoločný čas
            {% else %}⏳ Simonke zostáva {{ trigger.id }} min spoločného času
            {% endif %}(tablet {{ t }} + PC {{ p }} z {{ states('sensor.simona_rozpocet_celkom') | int(0) }} min).
      - repeat:
          for_each: ["5756450012", "8413756301"]
          sequence:
            - action: telegram_bot.send_message
              continue_on_error: true
              data:
                chat_id: "{{ repeat.item }}"
                parse_mode: html
                message: "{{ sprava }}"

# ---------------------------------------------------------------------------
# Akcie pre dashboard (tlacidla potrebuju sluzbu s parametrom)
# ---------------------------------------------------------------------------
script:
  simona_cas_pridaj:
    alias: "Simona čas: pridaj minúty"
    icon: mdi:clock-plus-outline
    mode: queued
    max: 5
    fields:
      minuty:
        name: Minúty
        required: true
        selector:
          number:
            min: 1
            max: 240
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: >-
            {{ [ (states('input_number.simona_rozpocet_dnes') | int(0)) + (minuty | int(0)), 1440 ] | min }}

  simona_cas_nastav:
    alias: "Simona čas: nastav rozpočet"
    icon: mdi:wallet-outline
    mode: queued
    max: 5
    fields:
      minuty:
        name: Minúty
        required: true
        selector:
          number:
            min: 0
            max: 1440
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: "{{ [ minuty | int(0), 1440 ] | min }}"

  # Zroluje rozpocet na uz spotrebovane - tablet sa tym hned zamkne,
  # PC sa neblokuje, len o tom pride upozornenie.
  simona_cas_ukonci:
    alias: "Simona čas: ukonči teraz"
    icon: mdi:timer-off-outline
    mode: single
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.simona_rozpocet_dnes
        data:
          value: "{{ states('sensor.simona_cas_pouzity') | int(0) }}"

  # Preposle prikaz agentovi na PC (rovnaky kanal ako Telegram menu).
  simona_pc_prikaz:
    alias: "Simona PC: pošli príkaz"
    icon: mdi:desktop-classic
    mode: queued
    max: 5
    fields:
      akcia:
        name: Akcia
        required: true
        selector:
          select:
            options: [lock, sleep, logoff, shutdown, restart, cancel, mute, unmute]
    sequence:
      - action: rest_command.pc_cmd
        continue_on_error: true
        data:
          action: "{{ akcia }}"
          args: ""
