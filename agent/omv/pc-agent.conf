# /etc/nginx/openmediavault-webgui.d/pc-agent.conf
# Distribucia verzii PC agenta pre Simonkin pocitac. Staticke subory,
# LAN only (port 80 je aj tak len v domacej sieti). Ziadny listing.
location ^~ /pc-agent/ {
    alias /var/www/pc-agent/;
    autoindex off;
    add_header Cache-Control "no-store";
    types { application/json json; text/plain sig txt ps1 md; }
    default_type text/plain;
    # server-level error_page 404 presmeruje na SPA web GUI (200 text/html) - tu chceme ciste 404
    error_page 404 /pc-agent/404.json;
}
