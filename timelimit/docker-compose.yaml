# TimeLimit.io - self-hosted server pre rodicovsky dohlad.
# Mailpit je tu preto, ze TimeLimit posiela rodicovi prihlasovacie kody mailom;
# bez neho by sa neda ani zaregistrovat. Kody si precitas na http://192.168.1.249:8025
services:
  api:
    image: ghcr.io/michaelsp/timelimit-server/timelimit:v1.17.0
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      # Tento fork necita DATABASE_URL, ale samostatne DB_* premenne; bez
      # DB_DRIVER ticho spadne na sqlite://test.db a nenajde si tabulky.
      DB_DRIVER: mariadb
      DB_HOST: database
      DB_PORT: "3306"
      DB_NAME: timelimit
      DB_USER: timelimit
      DB_PASS: "${DB_PASS}"
      PORT: "8080"
      MAIL_SENDER: "timelimit@fabrici.xyz"
      MAIL_TRANSPORT: '{"host":"mail","port":1025,"secure":false,"ignoreTLS":true}'
      ALWAYS_PRO: "yes"
    volumes:
      # Oprava chybneho globu na migracie v image - viz patches/umzug.js
      - ./patches/umzug.js:/usr/src/app/build/database/migration/umzug.js:ro
    depends_on:
      - database
      - mail

  database:
    image: mariadb:12
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASS}"
      MARIADB_DATABASE: timelimit
      MARIADB_USER: timelimit
      MARIADB_PASSWORD: "${DB_PASS}"
    volumes:
      - ./database:/var/lib/mysql

  mail:
    image: axllent/mailpit:latest
    restart: always
    ports:
      - "8025:8025"
